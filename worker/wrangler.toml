name = "japan-map-ai"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
# DEEPSEEK_API_KEY 通过 wrangler secret put 设置，不写在代码里

# 可选：绑定 KV 启用跨 isolate 持久化限流（未绑定时自动回退内存计数）
# 创建：wrangler kv namespace create RATE_LIMIT_KV
# 然后把输出的 id 填入下面：
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "你的-namespace-id"
